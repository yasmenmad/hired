<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sara 3D Avatar Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080614;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #avatar {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Loading HUD -->
  <div id="loadingHUD" style="position:absolute;z-index:10;display:flex;flex-direction:column;align-items:center;gap:12px;color:#a78bfa;transition:opacity 0.4s ease;">
    <div style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(167,139,250,0.2);border-top-color:#a78bfa;animation:spin 0.8s linear infinite;"></div>
    <div id="loadingText" style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">Sara 3D Engine Initializing...</div>
  </div>

  <div id="avatar"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs",
      "lipsync-en": "./lipsync-en.mjs"
    }
  }
  </script>

  <script type="module">
    import { TalkingHead } from "talkinghead";
    import { LipsyncEn } from "lipsync-en";

    const nodeAvatar = document.getElementById('avatar');
    const loadingText = document.getElementById('loadingText');
    const loadingHUD = document.getElementById('loadingHUD');

    const head = new TalkingHead(nodeAvatar, {
      cameraView: "upper",
      cameraDistance: 0.05,
      cameraY: 0.08,
      lightAmbientIntensity: 3.0,
      lightDirectIntensity: 32,
      avatarMood: "neutral",
      lipsyncModules: ["en"],
      lipsyncLang: "en",
      avatarIdleEyeContact: 0.82,
      avatarIdleHeadMove: 2.2,
      avatarSpeakingHeadMove: 2.6,
      avatarSpeakingEyeContact: 0.94,
      modelFPS: 60,
      cameraRotateEnable: false,
      cameraPanEnable: false,
      cameraZoomEnable: false,
    });

    try {
      head.lipsync = head.lipsync || {};
      head.lipsync['en'] = new LipsyncEn();
    } catch (e) {
      console.warn("LipsyncEn warning:", e);
    }

    let avatarLoaded = false;
    let mouthAnimationId = null;
    let isSpeakingActive = false;
    let isUserSpeaking = false;
    let animFrameId = null;

    try {
      await head.showAvatar({
        url: "./models/avatar.glb",
        body: "F",
        avatarMood: "neutral",
        lipsyncLang: "en",
      }, (ev) => {
        if (ev.lengthComputable && loadingText) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          loadingText.textContent = `Loading Sara 3D: ${pct}%`;
        }
      });
      avatarLoaded = true;
      if (loadingHUD) {
        loadingHUD.style.opacity = '0';
        setTimeout(() => { loadingHUD.style.display = 'none'; }, 400);
      }

      head.lookAtCamera(400);
      console.log("Sara 3D Avatar fully loaded and animated");
      startContinuousLifelikeMotion();
    } catch (e) {
      console.error("Sara 3D Avatar failed to load:", e);
      if (loadingText) loadingText.textContent = "Sara Ready";
      if (loadingHUD) setTimeout(() => { loadingHUD.style.display = 'none'; }, 800);
    }

    // High-fidelity continuous procedural motion: breathing oscillation, subtle head tilts, listener nods
    function startContinuousLifelikeMotion() {
      let startTime = performance.now();
      let lastNod = 0;
      let lastGazeShift = 0;

      function loop(now) {
        if (!avatarLoaded) return;
        const elapsed = (now - startTime) / 1000;

        // 1. Natural thoracic breathing cycle: subtle chest & neck rotation
        const breathCycle = Math.sin(elapsed * 1.4);
        if (head?.scene) {
          head.scene.position.y = breathCycle * 0.0025;
        }

        // 2. Periodic attentive listening nods when user is speaking
        if (isUserSpeaking && !isSpeakingActive && (now - lastNod > 2800)) {
          lastNod = now;
          try {
            head.lookAt(0, -0.06, 350);
            setTimeout(() => {
              try { head.lookAtCamera(450); } catch(e){}
            }, 400);
          } catch(e){}
        }

        // 3. Natural gaze saccades (shifting focus gently around the screen)
        if (!isSpeakingActive && !isUserSpeaking && (now - lastGazeShift > 3200)) {
          lastGazeShift = now;
          const gx = (Math.random() - 0.5) * 0.14;
          const gy = (Math.random() - 0.5) * 0.08;
          try {
            head.lookAt(gx, gy, 1200);
            if (Math.random() < 0.45) {
              setTimeout(() => {
                try { head.lookAtCamera(600); } catch(e){}
              }, 1400);
            }
          } catch(e){}
        }

        animFrameId = requestAnimationFrame(loop);
      }

      animFrameId = requestAnimationFrame(loop);
    }

    const moodMap = {
      confident: "happy",
      engaged: "happy",
      analytical: "neutral",
      thoughtful: "neutral",
      stressed: "sad",
      frustrated: "angry",
      smile: "happy",
      happy: "happy",
      sad: "sad",
      angry: "angry",
      surprised: "happy",
      funnyFace: "happy",
      default: "neutral",
    };

    const visemeKeys = [
      'viseme_aa', 'viseme_E', 'viseme_I', 'viseme_O', 'viseme_U',
      'viseme_PP', 'viseme_SS', 'viseme_TH', 'viseme_DD', 'viseme_FF'
    ];

    function stopMouthLoop() {
      isSpeakingActive = false;
      if (mouthAnimationId) {
        cancelAnimationFrame(mouthAnimationId);
        mouthAnimationId = null;
      }
      visemeKeys.forEach(v => {
        const m = head?.mtAvatar?.[v];
        if (m) {
          m.value = 0;
          m.applied = 0;
          m.newvalue = 0;
          m.needsUpdate = true;
        }
      });
      try { head.lookAtCamera(500); } catch(e) {}
    }

    function startMouthLoop() {
      stopMouthLoop();
      isSpeakingActive = true;
      let startTime = performance.now();

      function step(now) {
        if (!isSpeakingActive) return;
        const elapsed = (now - startTime) / 1000;

        // Natural conversational mouth oscillation & phoneme morphing
        const syllable1 = Math.max(0, Math.sin(elapsed * 13));
        const syllable2 = Math.max(0, Math.sin(elapsed * 7.5 + 0.4));
        const syllable3 = Math.max(0, Math.sin(elapsed * 16.2 + 1.2));
        const mouthOpen = (syllable1 * 0.45 + syllable2 * 0.35 + syllable3 * 0.2);

        if (head?.mtAvatar) {
          if (head.mtAvatar['viseme_aa']) {
            head.mtAvatar['viseme_aa'].value = mouthOpen * 0.85;
            head.mtAvatar['viseme_aa'].needsUpdate = true;
          }
          if (head.mtAvatar['viseme_O']) {
            head.mtAvatar['viseme_O'].value = Math.max(0, Math.sin(elapsed * 8.3)) * 0.55;
            head.mtAvatar['viseme_O'].needsUpdate = true;
          }
          if (head.mtAvatar['viseme_I']) {
            head.mtAvatar['viseme_I'].value = Math.max(0, Math.cos(elapsed * 10.1)) * 0.45;
            head.mtAvatar['viseme_I'].needsUpdate = true;
          }
          // Expressive conversational eyebrows
          if (head.mtAvatar['browInnerUp']) {
            head.mtAvatar['browInnerUp'].value = Math.max(0, Math.sin(elapsed * 2.8)) * 0.3;
            head.mtAvatar['browInnerUp'].needsUpdate = true;
          }
        }

        // Speaking head movement & conversational gestures
        if (Math.sin(elapsed * 3.5) > 0.8) {
          try { head.lookAt(0, -0.05, 300); } catch(e) {}
        } else {
          try { head.lookAtCamera(400); } catch(e) {}
        }

        mouthAnimationId = requestAnimationFrame(step);
      }

      mouthAnimationId = requestAnimationFrame(step);
    }

    function unlockAudio() {
      if (head?.audioCtx && (head.audioCtx.state === 'suspended' || head.audioCtx.state === 'interrupted')) {
        head.audioCtx.resume().catch(() => {});
      }
    }

    window.addEventListener('pointerdown', unlockAudio);
    window.addEventListener('click', unlockAudio);

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      const { type, text, facialExpression, mood } = data;

      unlockAudio();

      if (type === "mood" && mood) {
        const m = moodMap[mood] || "neutral";
        head.setMood(m);
        return;
      }

      if (type === "user_speaking") {
        isUserSpeaking = !!data.active;
        if (isUserSpeaking && !isSpeakingActive) {
          try { head.lookAtCamera(300); } catch(e){}
        }
        return;
      }

      if (type === "speak" && text) {
        const m = moodMap[facialExpression] || "neutral";
        head.setMood(m);
        try { head.lookAtCamera(400); } catch (e) {}
        try { head.speakWithHands(0, 0.85); } catch (e) {}

        startMouthLoop();

        try {
          const sampleRate = 22050;
          const words = text.split(" ").filter(Boolean);
          const estimatedDuration = Math.max(1, (words.length / 130) * 60);
          const numSamples = Math.ceil(sampleRate * estimatedDuration);
          const audioCtx = head.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = audioCtx.createBuffer(1, numSamples, sampleRate);
          const wordDuration = (estimatedDuration * 1000) / words.length;
          const wtimes = words.map((_, i) => i * wordDuration);
          const wdurations = words.map(() => wordDuration * 0.9);

          head.speakAudio({
            audio: audioBuffer,
            words,
            wtimes,
            wdurations,
          }, { lipsyncLang: "en" });
        } catch (e) {
          console.warn("speakAudio fallback active:", e);
        }
      }

      if (type === "stop") {
        stopMouthLoop();
        try {
          head.speakMarker(() => {});
          if (head.speechQueue) head.speechQueue = [];
          if (head.audioPlaylist) head.audioPlaylist = [];
          if (head.audioSpeechSource) {
            try { head.audioSpeechSource.stop(); } catch (e) {}
          }
          head.isSpeaking = false;
          head.setMood("neutral");
        } catch (e) {}
      }
    });
  </script>
</body>

</html>
